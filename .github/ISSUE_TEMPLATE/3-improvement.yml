name: 现有优化
description: 对 Alpha 已有功能、性能或使用体验提出优化建议。
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue；功能无法正常工作请使用“错误报告”，全新能力请使用“新功能”。
  - type: input
    id: feature
    attributes:
      label: 涉及的现有功能
      placeholder: 请填写页面或功能名称。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 详细描述
      description: 至少 30 字。请说明当前行为、存在的不足、建议如何优化及优化后的预期效果。
      placeholder: 请描述具体使用场景和可改进的地方。
    validations:
      required: true
      min_length: 30
  - type: textarea
    id: references
    attributes:
      label: 补充材料（可选）
      description: 可提供对比截图、参考链接或其他说明。
    validations:
      required: false
