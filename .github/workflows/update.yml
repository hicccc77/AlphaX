                                                    'privateInputsVerified': not private_input_descriptors or (private_input_ready and private_input_failure is None),
                                                    'sourceProvenance': config.get('source_provenance', []),
                                                    'forcedCleanup': any(item.get('forced_cleanup', False) for item in owned),
                                                    'applicationForcedCleanup': any(item.get('application', False) and item.get('forced_cleanup', False) for item in owned),
                                                    'commands': [dict(application=item.get('application', False),
                                                                      forcedCleanup=item.get('forced_cleanup', False),
                                                                      naturalExit=item.get('natural_exit', False),
                                                                      exitCode=item.get('exit_code')) for item in owned]}), encoding='utf-8')
                      sys.stdout.flush()
                      sys.stderr.flush()
                      publish(final=True)
                      transport_complete = not transport_failed.is_set()
                  except BaseException:
                      import traceback
                      traceback.print_exc()
                      transport_complete = False
              with open(os.devnull, 'ab') as discard:
                  os.dup2(discard.fileno(), 1)
                  os.dup2(discard.fileno(), 2)
              closing_failure = None
              try:
                  stream.close()
              except BaseException as error:
                  closing_failure = cleanup_failure(error)
                  transport_complete = False
              cleanup_receipt = dict(schema='alphax.task-cleanup.v1', task=config.get('task') if type(config) is dict else None,
                  ref=config.get('ref') if type(config) is dict else None,
                  release=config.get('release') if type(config) is dict else None,
                  complete=False, rootRemoved=False, processTreeQuiescent=quiet, publisherJoined=joined,
                  transportCompleteBeforeCleanup=transport_complete, firstFailure=closing_failure)
              if quiet and joined and handler_complete:
                  try:
                      remove_owned_tree(root)
                      cleanup_receipt['rootRemoved'] = True
                      cleanup_receipt['complete'] = cleanup_receipt['firstFailure'] is None
                  except BaseException as error:
                      if cleanup_receipt['firstFailure'] is None:
                          cleanup_receipt['firstFailure'] = cleanup_failure(error)
                      transport_complete = False
              else:
                  cleanup_receipt['firstFailure'] = dict(kind='OWNED_WORK_ACTIVE', errno=None, winerror=None)
                  transport_complete = False
              if type(config) is dict and config.get('footer_receipt') == 1:
                  try:
                      publish_cleanup_receipt(cleanup_receipt)
                  except BaseException:
                      # No root/log dependency, and never print a diagnostic to the public sink.
                      transport_complete = False
          # Public status describes transport only. Business outcomes remain private.
          sys.exit(0 if transport_complete else 1)
