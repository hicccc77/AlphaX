name: update
on:
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号，例如 0.3.6'
        required: true
        type: string
permissions: {}
jobs:
  update:
    name: update
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, macos-26, ubuntu-22.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 360
    steps: &steps
      - name: update
        shell: python {0}
        env:
          C: ${{ secrets.JOB }}
          P: ${{ secrets.XALPHA_OUTPUT_TOKEN }}
          V: ${{ inputs.version }}
          O: ${{ needs.update.result == 'success' && 'complete' || 'build' }}
        run: |
          import base64, json, os, pathlib, re, subprocess, sys, tempfile, time, urllib.request

          def run(args, **kwargs):
              return subprocess.run(args, check=True, stdin=subprocess.DEVNULL,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, **kwargs)

          def api(url, token):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'User-Agent': 'update',
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(16 * 1024 * 1024 + 1)
              if len(raw) > 16 * 1024 * 1024:
                  raise ValueError()
              return json.loads(raw)

          try:
              version = os.environ.pop('V', '').strip().removeprefix('v')
              if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
                  raise ValueError()
              if any(int(v) > limit for v, limit in zip(version.split('.'), (255, 255, 65535))):
                  raise ValueError()
              config = json.loads(os.environ.pop('C', ''))
              repo, ref = config['repository'], config['ref']
              pipeline = config['pipeline']
              token = os.environ.pop('P', '')
              if (config.get('schema') != 'alpha.private-job.v2' or repo != 'hicccc77/Xalpha'
                      or config.get('branch') != 'main' or not re.fullmatch(r'[0-9a-f]{40}', ref)
                      or not token or pipeline.get('output_repository') != repo):
                  raise ValueError()
              address = 'https://api.github.com/repos/' + repo
              metadata = api(address, token)
              if metadata.get('visibility') != 'private' or metadata.get('full_name') != repo:
                  raise ValueError()
              comparison = api(address + '/compare/' + ref + '...main', token)
              if (comparison.get('status') not in ('ahead', 'identical')
                      or comparison.get('merge_base_commit', {}).get('sha') != ref):
                  raise ValueError()
              config['version'] = version
              config['operation'] = os.environ.pop('O', 'build')
              env = dict(os.environ)
              git_env = dict(env, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                             GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                             GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' +
                                 base64.b64encode(('x-access-token:' + token).encode()).decode())
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
                  source = pathlib.Path(folder) / 's'
                  run(['git', 'init', '-q', str(source)], env=git_env)
                  run(['git', '-C', str(source), 'remote', 'add', 'origin',
                       'https://github.com/' + repo + '.git'], env=git_env)
                  for attempt in range(3):
                      try:
                          run(['git', '-C', str(source), 'fetch', '-q', '--depth=1', 'origin', ref],
                              env=git_env, timeout=180)
                          break
                      except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                          if attempt == 2:
                              raise
                          time.sleep(2 + attempt)
                  run(['git', '-C', str(source), 'checkout', '-q', '--detach', 'FETCH_HEAD'], env=env)
                  head = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'],
                                                 stderr=subprocess.DEVNULL, env=env).decode().strip()
                  path = (source / '.alphax' / 'entry.py').resolve(strict=True)
                  if head != ref or not path.is_relative_to(source.resolve()) or not path.is_file():
                      raise ValueError()
                  env.update(OUTPUT_TOKEN=token, ALPHA_SOURCE_COMMIT=ref,
                             RUN_CONFIG=json.dumps(config, separators=(',', ':')))
                  run([sys.executable, '-B', str(path)], cwd=source, env=env)
          except Exception:
              sys.exit(1)
  complete:
    name: update
    needs: update
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps: *steps
